<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#25282d;display:grid;place-items:center}#frame{width:min(270px,90vw);aspect-ratio:9/16;background:#f6f7f9;overflow:hidden}#frame svg{width:100%;height:100%;display:block}</style></head><body><div id="frame"></div><script type="module">
import {REEL_SAMPLES,parseReel} from '../js/json.js';import{renderProjectSvg}from'../js/engine.js';const q=new URLSearchParams(location.search),label=q.get('sample');let source=REEL_SAMPLES.find(s=>s.label===label)?.data;if(label==='Skate Kid'){const response=await fetch('../samples/skate-kid.reel.json');if(response.ok)source=await response.json()}const project=parseReel(JSON.stringify(source||REEL_SAMPLES[0].data)).project,time=Number(q.get('t')||0),root=document.querySelector('#frame');root.style.aspectRatio=`${project.canvas.w}/${project.canvas.h}`;root.innerHTML=renderProjectSvg(project,time);await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));document.documentElement.dataset.ready='true';
</script></body></html>
